name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned, not @latest: unpinned installed a version in a prior CI run
      # that reported "Validating plugin manifest: .../agents" (the same
      # wording used for a manifest *file*) instead of "Validating
      # components in: .../agents" like the version below does — i.e. it
      # looks like an older release without directory-component validation.
      # Bump this deliberately when you want a newer CLI, not by accident.
      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.240
          claude --version

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      # Debug output kept deliberately: a prior run failed here with
      # "No manifest found in directory" for `agents` even though the
      # manifest steps above (same job, same checkout) found .claude-plugin
      # fine — reproduced locally with the same CLI version and it worked,
      # so this is CI-environment-specific and not yet understood. If it
      # fails again, this gives us the actual filesystem state to diagnose
      # instead of guessing blind.
      - name: Validate agents
        run: |
          pwd
          ls -la
          ls -la .claude-plugin
          claude plugin validate ./agents --strict

      - name: Validate commands
        run: claude plugin validate ./commands --strict

      - name: Validate skills
        run: claude plugin validate ./skills --strict

      - name: Check workflow scripts (syntax + stabilize-loop drift)
        run: ./scripts/check-workflows.sh

      - name: Check plugin version bump
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-version-bump.sh
